name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Reservation tests
        run: cd backend && python -m pytest tests/test_reservation.py -q

      - name: Pathfinding tests
        run: cd backend && python -m pytest tests/test_pathfinding.py -q

      - name: Engine integration tests
        run: cd backend && python -m pytest tests/test_engine_integration.py -q

      - name: Server tests
        run: cd backend && python -m pytest tests/test_server.py -q

      - name: Fault and telemetry tests
        run: cd backend && python -m pytest tests/test_faults.py tests/test_telemetry.py tests/test_experiments.py -q

      - name: Fast suite (excludes slow randomized collision sweep)
        run: |
          cd backend && python -m pytest -q \
            --deselect tests/test_no_collisions.py::test_zero_collisions_over_randomised_runs
