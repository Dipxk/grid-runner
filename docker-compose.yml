services:
  robofleet:
    build: .
    container_name: robofleet
    ports:
      - "8000:8000"
    environment:
      # Any SimConfig field can be overridden via ROBOFLEET_* env vars.
      ROBOFLEET_FLEET_SIZE: "18"
      ROBOFLEET_TICKS_PER_SECOND: "6"
    volumes:
      # Live-reload the demo while iterating locally.
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: >
      uvicorn app.server:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/backend
    restart: unless-stopped
