# Free Render Blueprint for the live RoboFleet demo.
# Dashboard → New → Blueprint → this repo, or:
#   https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: robofleet
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ROBOFLEET_FLEET_SIZE
        value: "12"
      - key: ROBOFLEET_TICKS_PER_SECOND
        value: "4"
